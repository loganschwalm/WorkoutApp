# Runs every test suite, on the oldest and a current Python, on each push and pull request. When they pass on main, the
# same commit moves the `stable` branch, which installs and updates follow (ct/workout-tracker.sh), so a push only
# reaches servers once it is green. To hold releases back, set the repository variable HOLD_STABLE to true (Settings, Secrets and
# variables, Actions, Variables): pushes are still tested but stable stays where it is. To release what is on main while that is
# set, run this workflow by hand on main with "Move stable" ticked; it tests main again first.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      promote:
        description: Move stable to main once the tests pass, even while HOLD_STABLE is true
        type: boolean
        default: false

# Nothing here needs more than reading the repository; the one job that moves `stable` asks for write access itself (promote).
# The actions are pinned to the commit a release points at, so a tag moved later cannot change what runs with that access.
permissions:
  contents: read

# The runner image is named, not "latest": GitHub moves latest to a new Ubuntu on its own date (26, from 19 October 2026), and the
# browser tests, the sandbox settings and the installer's systemd checks are written against this one. Moving is a change made on purpose.
jobs:
  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # Both finish, so a failure on one version shows whether the other has it too.
      fail-fast: false
      matrix:
        # The oldest Python the README says the server runs on, the one the Docker image uses, and the newest a Debian ships
        # (13). 3.14 waits for the pinned pyflakes to say it understands it.
        python: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install the test requirements
        run: pip install -r tests/requirements.txt

      # Cheap, so first: slips in the Python, and the lists kept by hand (what the service worker caches, names the scripts
      # share, what the reference documents) agreeing with the files. tests/lint.py says what it checks.
      - name: Check the code and that the project hangs together
        run: |
          python -m pyflakes backend tests scripts docker-entrypoint.py
          python tests/lint.py

      # Ubuntu 24.04 stops unprivileged programs from making user namespaces, which Chrome's sandbox needs.
      - name: Let Chrome use its sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # The installer runs as root on a Proxmox host, straight from a curl, so it is read by ShellCheck as well as parsed. Its
      # settings are in .shellcheckrc. The runner has ShellCheck already.
      - name: Check the shell scripts
        run: |
          for script in ct/workout-tracker.sh scripts/docker-backup.sh tests/as-root.sh tests/docker.sh; do bash -n "$script"; done
          shellcheck ct/workout-tracker.sh scripts/docker-backup.sh tests/as-root.sh tests/docker.sh

      # Four suites at a time on the runner's four cores, so timing checks are not starved.
      - name: Run the tests
        run: python tests/run.py --jobs 4

  # What only root can check, on the runner, which is thrown away afterwards: the installer updating a server (and going back
  # when the new version does not start), and the Docker entrypoint handing over the data directory. See tests/as-root.sh.
  as-root:
    name: as root (installer updates, Docker entrypoint)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install, update, go back from a failed update, and hand over a data directory
        run: sudo bash tests/as-root.sh

  # The Docker install as the README has it followed: the image built and started with docker compose, healthy and not running as root, what
  # is saved kept in the volume across a restart, and scripts/docker-backup.sh making a backup that opens (and leaving nothing behind when
  # it fails). A broken image is as much a broken release as a failing test. See tests/docker.sh.
  docker:
    name: Docker image and backup script
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and run the image, save a workout, restart it, and back it up
        run: bash tests/docker.sh

      # What is published (see publish below) is built for both kinds of machine, so the one this runner is not (an arm64 build, run in
      # an emulator) is built here too, without being kept, to show a failure before the commit is on main rather than on its way out.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image for amd64 and arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false

  promote:
    needs: [test, as-root, docker]
    if: >-
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && vars.HOLD_STABLE != 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.promote))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # One promotion at a time, so an older run finishing late cannot move stable back.
    concurrency: promote-stable
    # Whether stable was moved to this commit (and not already at it, or past it), which is what the image published after it follows.
    outputs:
      moved: ${{ steps.move.outputs.moved }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Move stable to this commit
        id: move
        run: |
          if git fetch --quiet origin stable 2>/dev/null && git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "stable already has $GITHUB_SHA or something newer."
            echo "moved=false" >> "$GITHUB_OUTPUT"
          else
            git push origin "$GITHUB_SHA:refs/heads/stable"
            echo "moved=true" >> "$GITHUB_OUTPUT"
          fi

  # The image for Docker installs, built from the commit stable now has and kept in GitHub's registry, so a Docker install pulls it
  # (`docker compose pull`) instead of building. Only when promote moved stable here: a run that finished late, and found stable past
  # it, must not put an older image under the tag. Pushes made with the workflow's token do not start another run, which is why this is a
  # job of this run and not a workflow that waits for a push to stable.
  publish:
    needs: promote
    if: needs.promote.outputs.moved == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency: promote-stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The registry wants the name in lower case, and a fork has its own owner.
      - name: Name the image
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for amd64 and arm64 and publish as stable and by commit
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:stable
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
