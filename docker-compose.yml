services:
  workout-tracker:
    # The image published for the stable branch (what installs follow): `docker compose pull` fetches it, and `docker compose up -d --build`
    # builds one from this checkout instead and keeps it under the same name.
    image: ghcr.io/loganschwalm/workoutapp:stable
    build: .
    container_name: workout-tracker
    restart: unless-stopped
    # The container is held to what it needs. Its own filesystem is read-only (everything it keeps is in the volume, and /tmp is memory),
    # it starts as root only to hand the volume to the workout user and then runs without any capability at all, it can never gain a
    # privilege it does not have (no-new-privileges), and it cannot start more than 1024 processes or threads (the server uses a thread for
    # each of at most 512 connections). The five capabilities are the entrypoint's: to change the owner of the volume and to become
    # the workout user; DAC_OVERRIDE and FOWNER let it do that to files a volume from an older image left owned by someone else, and
    # let docker-backup.sh, which runs as root in the container, read the database.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    ports:
      # Open to everything that can reach this machine. With a reverse proxy on this same machine, publish the port to it alone,
      # so nothing can go around the proxy (and its HTTPS, limits and login) to the app: "127.0.0.1:6769:6769". With one on
      # another machine, name this machine's address on the network it uses, such as "192.168.1.50:6769:6769".
      - "6769:6769"
    volumes:
      - workout_data:/app/data
    environment:
      PORT: 6769
      WORKOUT_DB: /app/data/workouts.db
      # Set to "0" once your accounts exist, so nobody else can create one.
      ALLOW_REGISTRATION: "1"
      # Or leave registration open but ask for a code to make an account (at least 12 characters, and nothing anyone would guess; a random
      # one: python3 -c "import secrets; print(secrets.token_urlsafe(12))"). The sign-in page then asks for it.
      # REGISTRATION_CODE: change-me-to-something-long
      # Mail server for "Forgot password?" emails. Without SMTP_HOST, reset passwords from the command line:
      #   docker compose exec workout-tracker python /app/server.py reset-password <username>
      # See "Password reset emails" in README.md (the full detail is in readme-for-llm.md).
      # SMTP_HOST: smtp.gmail.com
      # SMTP_USERNAME: you@gmail.com
      # SMTP_PASSWORD: your-app-password
      # SMTP_FROM: Workout Tracker <you@gmail.com>

volumes:
  workout_data:
