<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout History | Workout Tracker</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#f4f7fb" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Workouts" />
</head>
<body>
  <main class="shell">
    <header>
      <div><h1>Workout History</h1><p class="subtitle">Review every workout you have saved.</p></div>
      <nav class="site-nav" aria-label="Primary navigation"><a href="index.html">Tracker</a><a href="progress.html">Progress</a><a class="active" href="history.html">History</a></nav>
      <div class="header-actions"><div class="date" id="today"></div><button class="secondary settings-button" id="settingsButton" type="button" aria-label="Settings" title="Settings">&#9881;</button></div>
    </header>

    <section class="card">
      <div class="section-heading"><div><h2>All saved workouts</h2><p class="subtitle">Start any saved workout again from its original exercise list.</p></div><span id="historySummary" class="subtitle"></span></div>
      <ul class="saved-workout-list" id="historyList"><li class="empty">No saved workouts yet.</li></ul>
    </section>
  </main>
  <div class="modal-backdrop" id="settingsModal" hidden>
    <section class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="settings-heading"><h2 id="settingsTitle">Settings</h2><button class="modal-close" id="closeSettings" type="button" aria-label="Close settings">&times;</button></div>
      <form id="settingsForm">
        <label for="themeSetting">Appearance</label><select id="themeSetting"><option value="light">Light mode</option><option value="dark">Dark mode</option></select>
        <label for="restDurationSetting">Default rest duration (seconds)</label><input id="restDurationSetting" type="number" min="15" max="600" step="15" />
        <label class="setting-check"><input id="autoRestSetting" type="checkbox" /> Start the rest timer automatically after each set</label>
        <label class="setting-check"><input id="confirmEndSetting" type="checkbox" /> Confirm before ending an active workout</label>
        <label class="setting-check"><input id="soundEnabledSetting" type="checkbox" /> Play a sound when rest ends</label>
        <label for="alertSoundSetting">Alert sound</label><select id="alertSoundSetting"><option value="beep">Double beep</option><option value="chime">Chime</option><option value="long">Long tone</option></select>
        <label for="soundVolumeSetting">Volume</label><input id="soundVolumeSetting" type="range" min="0" max="100" step="5" />
        <label class="setting-check" id="vibrateSettingRow"><input id="vibrateSetting" type="checkbox" /> Vibrate when rest ends</label>
        <button class="secondary test-alert" id="testAlertButton" type="button">Test alert</button>
        <div class="account-row"><div class="account-details"><span class="subtitle" id="accountName"></span><span class="subtitle" id="accountEmail"></span><button class="link-button" id="changeEmailButton" type="button">Change email</button></div><button class="secondary" id="signOutButton" type="button">Sign out</button></div>
        <div class="email-editor" id="emailEditor" hidden><label for="emailSetting">Email</label><input id="emailSetting" type="email" form="emailForm" autocomplete="email" maxlength="254" required /><label for="emailPassword">Current password</label><input id="emailPassword" type="password" form="emailForm" autocomplete="current-password" required /><p class="auth-feedback" id="emailFeedback" role="alert" hidden></p><div class="email-actions"><button class="secondary" id="cancelEmail" type="button">Cancel</button><button class="primary" id="saveEmail" type="submit" form="emailForm">Save email</button></div></div>
        <div class="settings-actions"><button class="secondary" id="cancelSettings" type="button">Cancel</button><button class="primary" type="submit">Save settings</button></div>
      </form>
      <!-- The email fields sit inside the settings form but belong to this one (form="emailForm"), since forms cannot nest. -->
      <form id="emailForm" hidden></form>
    </section>
  </div>
  <script src="common.js"></script>
  <script src="offline.js"></script>
  <script src="settings.js"></script>
  <script src="history.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
