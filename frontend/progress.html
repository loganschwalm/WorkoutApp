<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Progress | Workout Tracker</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="theme.js"></script>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#f4f7fb" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Workouts" />
</head>
<body>
  <main class="shell">
    <header>
      <div><h1>Progress</h1><p class="subtitle">See how your training is moving over time.</p></div>
      <nav class="site-nav" aria-label="Primary navigation"><a href="index.html">Tracker</a><a class="active" href="progress.html">Progress</a><a href="history.html">History</a></nav>
      <div class="header-actions"><div class="date" id="today"></div><button class="secondary settings-button" id="settingsButton" type="button" aria-label="Settings" title="Settings">&#9881;</button></div>
    </header>

    <section class="card progress-card">
      <div class="section-heading"><div><h2 id="progressTitle">Heaviest weight</h2><p id="progressDescription" class="subtitle">Track progress by workout type and date.</p></div><span id="progressSummary" class="subtitle"></span></div>
      <div class="progress-filters"><div><label for="metricFilter">Metric</label><select id="metricFilter"><option value="weight">Heaviest weight</option><option value="reps">Best reps</option><option value="volume">Total volume</option></select></div><div><label for="exerciseFilter">Exercise</label><select id="exerciseFilter"><option value="all">All exercises</option></select></div><div><label for="workoutTypeFilter">Workout type</label><select id="workoutTypeFilter"><option value="all">All workout types</option></select></div><div><label for="startDateFilter">From</label><input id="startDateFilter" type="date" /></div><div><label for="endDateFilter">To</label><input id="endDateFilter" type="date" /></div><button class="secondary" id="clearFilters" type="button">Clear filters</button></div>
      <div class="chart-shell"><canvas id="progressChart" aria-label="Workout progress chart"></canvas><p id="chartEmpty" class="chart-empty" hidden>No saved workouts yet. Save a workout to start tracking progress.</p></div>
      <div id="legend" class="legend" aria-label="Workout types"></div>
    </section>
  </main>
  <div class="modal-backdrop" id="settingsModal" hidden>
    <section class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="settings-heading"><h2 id="settingsTitle">Settings</h2><button class="modal-close" id="closeSettings" type="button" aria-label="Close settings">&times;</button></div>
      <form id="settingsForm">
        <label for="themeSetting">Appearance</label><select id="themeSetting"><option value="system">Match system</option><option value="light">Light mode</option><option value="dark">Dark mode</option></select>
        <label for="unitSetting">Weight unit</label><select id="unitSetting"><option value="lbs">Pounds (lbs)</option><option value="kg">Kilograms (kg)</option></select>
        <label for="weeklyGoalSetting">Weekly goal</label><select id="weeklyGoalSetting"><option value="1">1 workout a week</option><option value="2">2 workouts a week</option><option value="3">3 workouts a week</option><option value="4">4 workouts a week</option><option value="5">5 workouts a week</option><option value="6">6 workouts a week</option><option value="7">7 workouts a week</option></select>
        <label for="restDurationSetting">Default rest duration (seconds)</label><input id="restDurationSetting" type="number" inputmode="numeric" min="15" max="600" step="15" />
        <label class="setting-check"><input id="autoRestSetting" type="checkbox" /> Start the rest timer automatically after each set</label>
        <label class="setting-check"><input id="confirmEndSetting" type="checkbox" /> Confirm before ending an active workout</label>
        <label class="setting-check"><input id="soundEnabledSetting" type="checkbox" /> Play a sound when rest ends</label>
        <label for="alertSoundSetting">Alert sound</label><select id="alertSoundSetting"><option value="beep">Double beep</option><option value="chime">Chime</option><option value="long">Long tone</option></select>
        <label for="soundVolumeSetting">Volume</label><input id="soundVolumeSetting" type="range" min="0" max="100" step="5" />
        <label class="setting-check" id="vibrateSettingRow"><input id="vibrateSetting" type="checkbox" /> Vibrate when rest ends</label>
        <button class="secondary test-alert" id="testAlertButton" type="button">Test alert</button>
        <div class="account-row"><div class="account-details"><span class="subtitle" id="accountName"></span><span class="subtitle" id="accountEmail"></span><button class="link-button" id="changeEmailButton" type="button">Change email</button></div><button class="secondary" id="signOutButton" type="button">Sign out</button></div>
        <div class="email-editor" id="emailEditor" hidden><label for="emailSetting">Email</label><input id="emailSetting" type="email" form="emailForm" autocomplete="email" maxlength="254" required /><label for="emailPassword">Current password</label><input id="emailPassword" type="password" form="emailForm" autocomplete="current-password" required /><p class="auth-feedback" id="emailFeedback" role="alert" hidden></p><div class="email-actions"><button class="secondary" id="cancelEmail" type="button">Cancel</button><button class="primary" id="saveEmail" type="submit" form="emailForm">Save email</button></div></div>
        <div class="settings-actions"><button class="secondary" id="cancelSettings" type="button">Cancel</button><button class="primary" type="submit">Save settings</button></div>
      </form>
      <!-- The email fields sit inside the settings form but belong to this one (form="emailForm"), since forms cannot nest. -->
      <form id="emailForm" hidden></form>
    </section>
  </div>
  <script src="common.js"></script>
  <script src="offline.js"></script>
  <script src="settings.js"></script>
  <script src="progress.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
