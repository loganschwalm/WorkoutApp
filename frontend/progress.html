<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Progress | Workout Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header>
      <div><h1>Progress</h1><p class="subtitle">See how your training is moving over time.</p></div>
      <nav class="site-nav" aria-label="Primary navigation"><a href="index.html">Tracker</a><a class="active" href="progress.html">Progress</a><a href="history.html">History</a></nav>
      <div class="header-actions"><div class="date" id="today"></div><button class="secondary settings-button" id="settingsButton" type="button" aria-label="Settings" title="Settings">&#9881;</button></div>
    </header>

    <section class="card progress-card">
      <div class="section-heading"><div><h2 id="progressTitle">Heaviest weight</h2><p id="progressDescription" class="subtitle">Track progress by workout type and date.</p></div><span id="progressSummary" class="subtitle"></span></div>
      <div class="progress-filters"><div><label for="metricFilter">Metric</label><select id="metricFilter"><option value="weight">Heaviest weight</option><option value="reps">Best reps</option><option value="volume">Total volume</option></select></div><div><label for="exerciseFilter">Exercise</label><select id="exerciseFilter"><option value="all">All exercises</option></select></div><div><label for="workoutTypeFilter">Workout type</label><select id="workoutTypeFilter"><option value="all">All workout types</option></select></div><div><label for="startDateFilter">From</label><input id="startDateFilter" type="date" /></div><div><label for="endDateFilter">To</label><input id="endDateFilter" type="date" /></div><button class="secondary" id="clearFilters" type="button">Clear filters</button></div>
      <div class="chart-shell"><canvas id="progressChart" aria-label="Workout progress chart"></canvas><p id="chartEmpty" class="chart-empty" hidden>No saved workouts yet. Save a workout to start tracking progress.</p></div>
      <div id="legend" class="legend" aria-label="Workout types"></div>
    </section>
  </main>
  <div class="modal-backdrop" id="settingsModal" hidden>
    <section class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="settings-heading"><h2 id="settingsTitle">Settings</h2><button class="modal-close" id="closeSettings" type="button" aria-label="Close settings">&times;</button></div>
      <form id="settingsForm">
        <label for="themeSetting">Appearance</label><select id="themeSetting"><option value="light">Light mode</option><option value="dark">Dark mode</option></select>
        <label for="restDurationSetting">Default rest duration (seconds)</label><input id="restDurationSetting" type="number" min="15" max="600" step="15" />
        <label class="setting-check"><input id="autoRestSetting" type="checkbox" /> Start the rest timer automatically after each set</label>
        <label class="setting-check"><input id="confirmEndSetting" type="checkbox" /> Confirm before ending an active workout</label>
        <div class="settings-actions"><button class="secondary" id="cancelSettings" type="button">Cancel</button><button class="primary" type="submit">Save settings</button></div>
      </form>
    </section>
  </div>
  <script src="settings.js"></script>
  <script src="offline.js"></script>
  <script src="progress.js"></script>
</body>
</html>
