<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in | Workout Tracker</title>
  <link rel="preload" href="fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css" />
  <script src="theme.js"></script>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#e8ebf0" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Workouts" />
</head>
<body>
  <main class="auth-shell">
    <section class="card auth-card">
      <h1>Workout Tracker</h1>
      <p class="subtitle">Private, self-hosted training data.</p>
      <div class="auth-tabs" id="authTabs"><button class="secondary active" id="loginTab" type="button">Sign in</button><button class="secondary" id="registerTab" type="button">Create account</button></div>
      <form id="authForm">
        <label for="email" id="emailLabel" hidden>Email</label><input id="email" type="email" autocomplete="email" maxlength="254" required hidden disabled />
        <label for="username" id="usernameLabel">Email or username</label><input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required minlength="3" />
        <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required minlength="8" aria-describedby="passwordAdvice" />
        <p class="field-advice" id="passwordAdvice" hidden></p>
        <label class="setting-check" for="remember"><input id="remember" type="checkbox" checked /> Remember me</label>
        <button class="primary" id="authSubmit" type="submit">Sign in</button>
        <button class="link-button" id="forgotButton" type="button" hidden>Forgot password?</button>
      </form>
      <form id="forgotForm" hidden>
        <h2>Reset your password</h2>
        <p class="subtitle">Enter the email on your account and we&rsquo;ll send it a code.</p>
        <label for="resetEmail">Email</label><input id="resetEmail" type="email" autocomplete="email" maxlength="254" required />
        <button class="primary" id="sendCodeButton" type="submit">Send code</button>
        <button class="link-button" type="button" data-back>Back to sign in</button>
      </form>
      <form id="resetForm" hidden>
        <h2>Enter your code</h2>
        <p class="subtitle" id="resetIntro"></p>
        <label for="resetCode">6-digit code</label><input id="resetCode" inputmode="numeric" autocomplete="one-time-code" required />
        <label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="128" aria-describedby="newPasswordAdvice" />
        <p class="field-advice" id="newPasswordAdvice"></p>
        <button class="primary" id="resetSubmit" type="submit">Reset password and sign in</button>
        <button class="link-button" id="resendCode" type="button">Send a new code</button>
        <button class="link-button" type="button" data-back>Back to sign in</button>
      </form>
      <p class="auth-feedback" id="authFeedback" role="alert" hidden></p>
      <p class="auth-notice" id="authNotice" role="status" hidden></p>
    </section>
  </main>
  <script src="account-rules.js"></script>
  <script src="login.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
